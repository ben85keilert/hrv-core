# Dependabot: wöchentliche Versionsupdates für die uv-Abhängigkeiten (uv.lock).
# Sicherheitsupdates laufen davon unabhängig (Repo-Einstellung).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
